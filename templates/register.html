<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #13223b; /* Cor de fundo */
            color: #fff; /* Cor do texto */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Altura total da tela */
        }
        .container {
            width: 100%;
            max-width: 400px; /* Largura máxima do container */
            padding: 20px;
            background: #ffffff; /* Fundo do container */
            color: #000; /* Cor do texto dentro do container */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-weight: bold; /* Negrito */
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 90%; /* Ajusta a largura dos campos de input */
            padding: 10px;
            border: 1px solid #000000;
            border-radius: 4px;
            margin: 0 auto;
            display: block;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            margin-top: 10px;
        }
        .btn-primary {
            background-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-back {
            background-color: #6c757d;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
        .message {
            color: #dc3545;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><strong>HBC Business</strong></h1>
        <form method="POST" action="/register">
            <div class="form-group">
                <input type="text" id="name" name="name" placeholder="Nome" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="text" id="phone" name="phone" placeholder="Telefone" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Senha" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar Senha" required>
            </div>
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a href="/login" class="btn btn-back">Voltar</a>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
